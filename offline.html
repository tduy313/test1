<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#059669">
<title>Offline — DurianSoil pH-Vision</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    background:linear-gradient(135deg,#ecfdf5,#d1fae5,#a7f3d0);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;color:#064e3b;
  }
  .box{
    background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
    border-radius:24px;padding:36px 28px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 20px 60px rgba(6,95,70,.25);
    border:1px solid rgba(255,255,255,.8);
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .icon{font-size:4.5rem;margin-bottom:12px;display:block;animation:float 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:1.4rem;color:#047857;margin-bottom:10px;font-weight:800}
  p{font-size:.92rem;color:#475569;line-height:1.6;margin-bottom:20px}
  .btn{
    display:inline-block;padding:14px 28px;border-radius:14px;
    background:linear-gradient(135deg,#10b981,#047857);color:#fff;
    font-weight:800;text-decoration:none;font-size:.95rem;
    box-shadow:0 8px 24px rgba(16,185,129,.4);
    transition:transform .25s ease, box-shadow .25s ease;
    border:none;cursor:pointer;font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.5)}
  .tip{
    margin-top:20px;padding:12px;background:#fef3c7;
    border-left:4px solid #f59e0b;border-radius:10px;
    font-size:.82rem;color:#92400e;text-align:left;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="icon">📡</span>
    <h1>Không có kết nối mạng</h1>
    <p>DurianSoil vẫn hoạt động offline! Các tính năng đo pH, crop ảnh, phân tích màu đều chạy được mà không cần mạng.</p>
    <a href="./index.html" class="btn">🔄 Thử lại / Mở app</a>
    <div class="tip">
      💡 <b>Mẹo:</b> Nếu bạn vừa cài app, hãy mở online 1 lần để tải đủ dữ liệu. Sau đó app chạy hoàn toàn offline.
    </div>
  </div>
  <script>
    // Auto-redirect sau 8s nếu mạng quay lại
    function checkOnline(){
      if(navigator.onLine){
        location.replace('./index.html');
      }
    }
    window.addEventListener('online', checkOnline);
    setTimeout(checkOnline, 8000);
  </script>
</body>
</html>
